name: qraft

x-common-env: &common-env
  DATABASE_URL: postgres://${POSTGRES_USER:-qraft}:${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}@postgresql:5432/${POSTGRES_DB:-qraft}?sslmode=disable
  POSTGRES_HOST: postgresql
  POSTGRES_USER: ${POSTGRES_USER:-qraft}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}
  POSTGRES_DB: ${POSTGRES_DB:-qraft}
  REDIS_URL: redis://redis:6379/0
  REDIS_ADDR: redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run python3 scripts/configure.py first}
  MINIO_BUCKET: ${MINIO_BUCKET:-qraft}
  MINIO_USE_SSL: "false"
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  PROVIDER_EFFECT_LEASE: ${PROVIDER_EFFECT_LEASE:-45m}
  # Keep host/local ANTHROPIC_* available only for explicit environment-key
  # mode. New workflows resolve the durable model-settings record and do not
  # treat these values as an implicit provider/model fallback.
  ANTHROPIC_API_KEY: ${ALGOFORGE_LLM_API_KEY:-${ANTHROPIC_API_KEY:-}}
  ANTHROPIC_BASE_URL: ${ALGOFORGE_LLM_BASE_URL:-${ANTHROPIC_BASE_URL:-}}
  ANTHROPIC_MODEL: ${ALGOFORGE_LLM_MODEL:-${ANTHROPIC_MODEL:-}}
  ANTHROPIC_PROVIDER: ${ALGOFORGE_LLM_PROVIDER:-${ANTHROPIC_PROVIDER:-}}
  ANTHROPIC_REASONING_EFFORT: ${ALGOFORGE_LLM_REASONING_EFFORT:-${ANTHROPIC_REASONING_EFFORT:-}}
  ALGOFORGE_LLM_REQUEST_TIMEOUT: ${ALGOFORGE_LLM_REQUEST_TIMEOUT:-30m}
  ALGOFORGE_EMBEDDING_API_KEY: ${ALGOFORGE_EMBEDDING_API_KEY:-}
  ALGOFORGE_EMBEDDING_BASE_URL: ${ALGOFORGE_EMBEDDING_BASE_URL:-}
  ALGOFORGE_EMBEDDING_MODEL: ${ALGOFORGE_EMBEDDING_MODEL:-}
  ALGOFORGE_EMBEDDING_DIMENSIONS: ${ALGOFORGE_EMBEDDING_DIMENSIONS:-1536}
  ALGOFORGE_EMBEDDING_TIMEOUT_SEC: ${ALGOFORGE_EMBEDDING_TIMEOUT_SEC:-30}
  ALGOFORGE_EMBEDDING_ENABLED: ${ALGOFORGE_EMBEDDING_ENABLED:-false}
  ALGOFORGE_EMBEDDING_UI_ALLOW_PUBLIC: ${ALGOFORGE_EMBEDDING_UI_ALLOW_PUBLIC:-true}
  ALGOFORGE_EMBEDDING_EXPECTED_STATEMENT_MODEL_VERSION_ID: ${ALGOFORGE_EMBEDDING_EXPECTED_STATEMENT_MODEL_VERSION_ID:-}
  JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/configure.py first}
  ALGOFORGE_SETTINGS_ENCRYPTION_KEY: ${ALGOFORGE_SETTINGS_ENCRYPTION_KEY:?Run python3 scripts/configure.py first}
  ALGOFORGE_QG14_MODEL_ROUTING_ENABLED: "true"
  ALGOFORGE_CUSTOM_GENERATION_API_MODE: ${ALGOFORGE_CUSTOM_GENERATION_API_MODE-jobs-v1}
  ALGOFORGE_QG15_EXPORT_MODE: ${ALGOFORGE_QG15_EXPORT_MODE-qg15-v1}
  ALGOFORGE_QUALITY_MODE: ${ALGOFORGE_QUALITY_MODE-quality-v1}
  ALGOFORGE_S5_DIVERSITY_MODE: ${ALGOFORGE_S5_DIVERSITY_MODE-diversity-v1}
  SANDBOX_URL: http://sandbox:8090
  APP_ENV: ${APP_ENV:-development}
  APP_DEV_MODE: ${APP_DEV_MODE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  postgresql:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}
      POSTGRES_DB: ${POSTGRES_DB:-qraft}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-18432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qraft} -d ${POSTGRES_DB:-qraft}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qraft

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-qraft-development}
    restart: "no"
    command: ["up"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qraft}:${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}@postgresql:5432/${POSTGRES_DB:-qraft}?sslmode=disable
    networks:
      - qraft

  temporal-db:
    image: ${TEMPORAL_POSTGRES_IMAGE:-postgres@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Run python3 scripts/configure.py first}
      POSTGRES_DB: ${TEMPORAL_DB_NAME:-temporal}
    ports:
      - "127.0.0.1:${TEMPORAL_DB_PORT:-18433}:5432"
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER:-temporal} -d ${TEMPORAL_DB_NAME:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qraft

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99}
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-18379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qraft

  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run python3 scripts/configure.py first}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19201}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qraft

  temporal:
    image: ${TEMPORAL_SERVER_IMAGE:-temporalio/auto-setup@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8}
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Run python3 scripts/configure.py first}
      POSTGRES_SEEDS: temporal-db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-17333}:7233"
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - qraft

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui@sha256:28bb3ea5a6ea3e09f16b521f32ab727c96470f7f1e420c66a6cbfb02001a8aa2}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-18182}:8080"
    networks:
      - qraft

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-qraft-development}
    restart: unless-stopped
    command: ["./server", "serve"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-18181}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qraft

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-qraft-development}
    restart: unless-stopped
    # LLM activities may legitimately run for up to the configured 35-minute
    # activity deadline. Let Temporal drain them before Docker force-kills the
    # worker; otherwise the provider-effect lease survives the kill and a
    # replay can sit busy for up to 45 minutes.
    stop_grace_period: 40m
    command: ["./worker"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *common-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_TASK_QUEUE: ${WORKER_TASK_QUEUE:-algoforge-tasks}
      WORKER_BUILD_ID: ${WORKER_BUILD_ID:-}
      WORKER_USE_BUILD_ID_VERSIONING: ${WORKER_USE_BUILD_ID_VERSIONING:-false}
      PROVIDER_EFFECT_LEASE: ${PROVIDER_EFFECT_LEASE:-45m}
      PROVENANCE_RETENTION_ENABLED: ${PROVENANCE_RETENTION_ENABLED:-true}
      PROVENANCE_RETENTION_INTERVAL: ${PROVENANCE_RETENTION_INTERVAL:-1h}
      PROVENANCE_RETENTION_BATCH_SIZE: ${PROVENANCE_RETENTION_BATCH_SIZE:-1000}
      PROVENANCE_RETENTION_MAX_BATCHES: ${PROVENANCE_RETENTION_MAX_BATCHES:-100}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_ENDPOINT: ${OUTBOX_ENDPOINT:-}
      OUTBOX_BEARER_TOKEN: ${OUTBOX_BEARER_TOKEN:-}
      OUTBOX_HMAC_SECRET: ${OUTBOX_HMAC_SECRET:-}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-2s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
      OUTBOX_LEASE_DURATION: ${OUTBOX_LEASE_DURATION:-5m}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_CONNECT_TIMEOUT: ${OUTBOX_CONNECT_TIMEOUT:-3s}
      OUTBOX_REQUEST_TIMEOUT: ${OUTBOX_REQUEST_TIMEOUT:-10s}
      OUTBOX_MAX_REQUEST_BYTES: ${OUTBOX_MAX_REQUEST_BYTES:-1048576}
      OUTBOX_MAX_RESPONSE_BYTES: ${OUTBOX_MAX_RESPONSE_BYTES:-65536}
      OUTBOX_READINESS_MAX_QUEUED: ${OUTBOX_READINESS_MAX_QUEUED:-1000}
      OUTBOX_READINESS_MAX_AGE: ${OUTBOX_READINESS_MAX_AGE:-5m}
      ALGOFORGE_S3_SANDBOX_IMAGE_DIGEST: ${ALGOFORGE_S3_SANDBOX_IMAGE_DIGEST:-}
      ALGOFORGE_S3_SANDBOX_TOOLCHAIN_MANIFEST_DIGEST: ${ALGOFORGE_S3_SANDBOX_TOOLCHAIN_MANIFEST_DIGEST:-}
      ALGOFORGE_S3_SANDBOX_SECCOMP_POLICY_DIGEST: ${ALGOFORGE_S3_SANDBOX_SECCOMP_POLICY_DIGEST:-}
      ALGOFORGE_S3_HIDDEN_RUNNER_URL: ${ALGOFORGE_S3_HIDDEN_RUNNER_URL:-}
      ALGOFORGE_S3_HIDDEN_RUNNER_BEARER_TOKEN: ${ALGOFORGE_S3_HIDDEN_RUNNER_BEARER_TOKEN:-}
      OUTBOX_HEALTH_ADDR: ":8092"
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    expose:
      - "8092"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8092/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qraft
      - sandbox_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL-}
        SOURCE_REVISION: ${SOURCE_REVISION:-qraft-development}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13100}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qraft

  sandbox:
    image: ${SANDBOX_IMAGE:-qraft-sandbox:local}
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      args:
        SANDBOX_REVISION: ${SANDBOX_REVISION:-unset}
    restart: unless-stopped
    privileged: true
    environment:
      SANDBOX_PORT: "8090"
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-5}
      # Per-case execute ceilings only. Compile is fixed at 60s/2048MiB.
      SANDBOX_TIME_LIMIT: ${SANDBOX_TIME_LIMIT:-10}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-512}
      SANDBOX_IMAGE_DIGEST: ${SANDBOX_IMAGE_DIGEST:-unverified}
      SANDBOX_AUDIT_LOG: /sandbox/audit/audit.jsonl
    volumes:
      - sandbox_audit:/sandbox/audit
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sandbox_internal

  caddy:
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    image: ${CADDY_IMAGE:-caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-18180}:80"
      - "127.0.0.1:${HTTPS_PORT:-18543}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qraft

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  temporal_pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  sandbox_audit:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  qraft:
    driver: bridge
  sandbox_internal:
    driver: bridge
    internal: true
